name: Auto Update Cloudflare IPs

on:
  schedule:
    # 国际标准时间 (UTC) 每小时第 0 分钟触发（相当于北京时间每整点运行）
    - cron: '0 * * * *'
  workflow_dispatch: # 保留 GitHub 页面手动点击触发按钮

jobs:
  update-ip:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装 Python 依赖
        run: |
          pip install requests pyyaml

      - name: 执行优选 IP 更新脚本
        run: python update.py

      - name: 自动提交并推送 sub.yaml 到仓库
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add sub.yaml
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 自动更新优选 IP 节点" && git push)
