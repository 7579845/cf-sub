name: Auto Update Sub

on:
  schedule:
    # 每 4 小时自动触发一次 (北京时间 0:00, 4:00, 8:00, 12:00, 16:00, 20:00)
    - cron: '0 */4 * * *'
  workflow_dispatch: # 保留手动触发按钮

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖包
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml

      - name: 运行更新脚本
        run: python update.py

      - name: 提交并推送更新后的订阅文件
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add sub.yaml
          git diff-index --quiet HEAD || git commit -m "auto: 自动更新 Cloudflare 优选 IP [$(date -u +'%Y-%m-%d %H:%M:%S') UTC]"
          git push
