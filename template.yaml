# ===================================================
# 2. 策略组配置 (Proxy Groups)
# ===================================================
proxy-groups:
  # 日本节点池（每 300 秒后台测速，优胜劣汰）
  - name: 日本节点自动选择
    type: url-test
    url: 'http://www.gstatic.com/generate_204'
    interval: 300
    tolerance: 50
    proxies:
      - "JP-01 (cloudflare.182682.xyz)"
      - "JP-02 (cf.877774.xyz)"
      - "JP-03 (cf.yfjc.sbs)"
      - "JP-04 (电信优选01)"
      - "JP-05 (电信优选02)"
      - "JP-06 (联通优选01)"
      - "JP-07 (联通优选02)"
      - "JP-08 (移动优选01)"
      - "JP-09 (移动优选02)"

  # 韩国节点池（每 300 秒后台测速，优胜劣汰）
  - name: 韩国节点自动选择
    type: url-test
    url: 'http://www.gstatic.com/generate_204'
    interval: 300
    tolerance: 50
    proxies:
      - "KR-01 (cf.yfjc.sbs)"
      - "KR-02 (cf.877774.xyz)"
      - "KR-03 (电信优选01)"
      - "KR-04 (电信优选02)"
      - "KR-05 (联通优选01)"
      - "KR-06 (联通优选02)"
      - "KR-07 (移动优选01)"
      - "KR-08 (移动优选02)"

  # 新加坡节点池（每 300 秒后台测速，优胜劣汰）
  - name: 新加坡节点自动选择
    type: url-test
    url: 'http://www.gstatic.com/generate_204'
    interval: 300
    tolerance: 50
    proxies:
      - "SG-01 (cloudflare.182682.xyz)"
      - "SG-02 (yg6.ygkkk.dpdns.org)"
      - "SG-03 (cf.yfjc.sbs)"
      - "SG-04 (电信优选01)"
      - "SG-05 (电信优选02)"
      - "SG-06 (联通优选01)"
      - "SG-07 (联通优选02)"
      - "SG-08 (移动优选01)"
      - "SG-09 (移动优选02)"

  # --- 业务分流逻辑绑定 ---
  
  # 1. AI 组：绑定日本自动选择
  - name: AI人工智能
    type: select
    proxies:
      - 日本节点自动选择

  # 2. 大流量影音组：绑定韩国自动选择
  - name: 大流量影音
    type: select
    proxies:
      - 韩国节点自动选择

  # 3. 非核心外网流量组：绑定新加坡自动选择
  - name: 非核心外网流量
    type: select
    proxies:
      - 新加坡节点自动选择

  # 4. 未匹配流量兜底策略
  - name: FINAL
    type: select
    proxies:
      - 非核心外网流量
      - 韩国节点自动选择
      - 日本节点自动选择

